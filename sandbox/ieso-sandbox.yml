note: >-
  IESO operates a full parallel sandbox estate — every production interface has a named sandbox twin,
  and the sandbox is a scheduled stage of the release train, going live roughly six weeks before each
  production build. There are no magic test values, test cards or fixture generators: the sandbox is a
  mirrored environment with its own credentials, not a simulator. The public report sandbox is the one
  piece of it anyone can use anonymously.
model: mirrored-environment
test_values_published: false
test_credential_self_serve: false
credential_note: >-

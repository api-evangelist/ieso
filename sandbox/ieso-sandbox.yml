  governed by the Market Rules, and registered Participants receive a unique and confidential User
  Account and Password to access this system." Sandbox credentials are distinct from production
  credentials; IESO warns participants to ensure "the credentials being used to connect to the IESO
  MRP systems are specific to the IESO Sandbox environment to minimize connection issues."

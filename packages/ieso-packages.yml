note: >-
  IESO ships exactly one first-party client artifact — the MIM Web Services Toolkit (MWT), a
  downloadable Java toolkit distributed as a ZIP from ieso.ca, not from any public package registry.
  There is no IESO organization on npm, PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist or
  crates.io, and no IESO GitHub organization (github.com/ieso is Ieso Digital Health, an unrelated UK
  mental-health company — see review.yml homonymTrap). The community has filled the gap with two
  well-known Python grid-data libraries that both ship a dedicated IESO connector against the public
  report repository.

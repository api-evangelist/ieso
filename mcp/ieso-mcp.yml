- group: participant reports
  auth: HTTP Basic machine account + '?idp_id=ieso'
  backing_surface: https://reports.ieso.ca/api/v1.4
  gated: true
  tools:
  - name: list_participant_files
    description: List directories and files in the participant's confidential report folder.
    rest: GET /files
  - name: list_participant_subfolder
    description: List a named subfolder in the confidential repository.
    rest: GET /files/{path}

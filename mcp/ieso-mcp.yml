search_result: No official or community MCP server for IESO exists. Searched the MCP registry, npm (@modelcontextprotocol
  scope), the IESO technical interfaces page and the wider web on 2026-07-27 — nothing. There is no IESO
  GitHub organization to host one (github.com/ieso is an unrelated UK mental-health company).
note: 'THIS IS A CANDIDATE DESIGN, NOT A DEPLOYED SERVER. No URL is recorded because none exists. Every
  tool below is bound to a real, verifiable IESO surface: either a WSDL operation that exists verbatim
  in wsdl/ieso-mim-web-services.wsdl, or a report directory that was enumerated live on the public repository.
  Nothing was invented. The public-data tools are the only ones an unauthenticated agent could actually
  run today.'

  docs: https://www.ieso.ca/sector-participants/technical-interfaces

deprecation:
  policy_url: https://www.ieso.ca/sector-participants/change-management/it-release-schedule
  policy_kind: change-management release train (not a sunset-header deprecation policy)
  sunset_header: false
  deprecation_header: false
  summary: >-
    Changes to IESO technical interfaces are only made through the scheduled IT release train. Each
    release moves through Preliminary Plan, Feedback Period, Target Plan, Final Plan, Sandbox
    Implementation and Production Build, with published dates at every stage. Category 3 releases —
    twice yearly — are the ones that "require market participants to make changes to their own
    technical interfaces". Category 2 releases — four times yearly — "require market participants to
    make a change in procedure or to update documentation".
  notice_period: >-
    Approximately 6.5 months from Preliminary Plan to Production Build, with the Sandbox
    implementation landing roughly 6 weeks before production (e.g. R56.0: Preliminary 27 May 2026,
    Final 22 Jul 2026, Sandbox 30 Jul 2026, Production 9 Sep 2026).
  feedback_contact: pending.changes@ieso.ca
  pending_changes:
    documents: https://www.ieso.ca/Sector-Participants/Change-Management/Pending-Changes-Documents
    reports: https://www.ieso.ca/Sector-Participants/Change-Management/Pending-Changes-Reports
  supersessions:
  - spec: SPEC467 Retrofit LDC API
    supersedes: SPEC-188 Retrofit API
    target_baseline: '56.0'
    target_date: '2026-09-09'
    comments_due: '2026-08-07'
    note: >-
      "New LDC API in Retrofit based on eDSM contracts for marketing and outreach". This is the one
      live API specification replacement in the current pending-changes package. Recorded because it
      affects ieso:ieso-retrofit-api.
  report_purging:
    described_in: IMO_SPEC_0100 section 2.4
    summary: >-
      Reports are removed once the per-report Report Retention Period is exceeded, measured from the
      document date. Global and Local Links are removed with the report. Purging runs roughly daily.
      This is the data-side retirement policy for the public repository.

sla:
  published: false
  note: >-
    No API service-level agreement, uptime target or availability commitment is published for any
    IESO interface. Availability obligations for the market systems themselves live in the Market
    Rules and market manuals, not in an API SLA.

status_page:

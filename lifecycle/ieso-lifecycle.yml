method: searched
source: >-
  https://www.ieso.ca/sector-participants/change-management/it-release-schedule and
  https://www.ieso.ca/Sector-Participants/Change-Management/Pending-Changes-Documents, fetched
  2026-07-27; IMO_SPEC_0100 revision history
note: >-
  IESO runs a formal, published IT release train with named categories, fixed calendar dates and a
  mandatory comment window. That release train IS IESO's deprecation and change-notice policy for
  technical interfaces — a Category 3 release is defined as one that requires market participants to
  change their own technical interfaces, and it is announced roughly six months ahead of production
  build. There is no RFC 8594 Sunset/Deprecation header support anywhere in the estate and no public
  status page.


  scheme: mixed
  reports_rest_api: {style: uri-path, current: v1.4, base: https://reports.ieso.ca/api/v1.4}
  mim_soap: {style: wsdl-namespace, current: 'http://webservices.ieso.ca/emim/', service: emim-web-service}
  online_ieso: {style: resource-prefix, current: reg-v1-facilities, base: https://online.ieso.ca/suite/webapi/}

note: >-
  IESO publishes no /.well-known/ discovery surface on its corporate site or on either report
  repository. The one real discovery document in the estate belongs to gateway.ieso.ca, the Okta
  identity provider that fronts participant login for reports.ieso.ca and the Online IESO portal —
  it is served anonymously and is harvested here verbatim. Several probes returned HTTP 200 with an
  HTML body (a Sitecore soft-404 on www.ieso.ca, the SecureTransport SAML login page on
  reports.ieso.ca, the Appian shell on online.ieso.ca); those are recorded as html_soft_200 and are
  NOT well-known documents.

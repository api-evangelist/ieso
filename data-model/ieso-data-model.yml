    prefix: DA
    directories: [DAAreaOpResShortfall, DAAreaOpResShortfall2, DAAreaReserveConst, DAAreaReserveConst2, DAConstTotals, DAConstrShadowPrices, DADynamicConstrainedAreas, DAGMPCSum, DAHourlyEnergyLMP, DAHourlyIntertieLMP, DAHourlyIntertieORLMP, DAHourlyIntertiePass1LMP, DAHourlyIntertiePass1ORLMP, DAHourlyORLMP, DAHourlyOntarioZonalPrice, DAHourlyZonal, DAIntertieSchedLimits, DAIntertieSchedLimits2, DASecurityConstraints, DASecurityConstraints2, DAShadowPrices, DATotals, DAVirtualTransactions]

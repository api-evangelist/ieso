generated: '2026-07-27'
method: derived
source: >-
  xsd/*.xsd (14 harvested schemas), wsdl/ieso-mim-web-services.wsdl, the live directory listing of
  https://reports-public.ieso.ca/public/ (139 directories enumerated 2026-07-27) and IMO_SPEC_0100
docs: https://www.ieso.ca/en/Power-Data/Data-Directory
note: >-
  IESO publishes no OpenAPI, so this entity graph is derived from the XML Schema definitions and the
  WSDL rather than from schema $ref links. Two independent object models exist in the estate and they
  do not share types: the automated-document model that governs every published report, and the MIM
  bid/offer model that governs participant submissions. Both are read directly out of the harvested
  files; report families are grouped from the real directory names on the public repository.

document_model:
  description: >-
    Every IESO automated document is an envelope of repeating header/body pairs. Two generations of
    the envelope are live side by side — the current ieso.ca namespace and the legacy theIMO.com
    namespace — with identical structure and one enum difference.
  namespaces:
    current: http://www.ieso.ca/schema
    legacy: http://www.theIMO.com/schema
  entities:
  - name: Document
    schema: xsd/ieso-document-r1.xsd
    namespace: http://www.ieso.ca/schema
    attributes:
    - {name: docID, type: 'string, pattern [a-zA-Z0-9]{1,100}'}
    note: Sequence of (DocHeader, DocBody) repeated 1..unbounded.
  - name: IMODocument
    schema: xsd/ieso-imo-document-r1.xsd
    namespace: http://www.theIMO.com/schema
    attributes:
    - {name: docID, type: 'string, pattern [a-zA-Z0-9]{1,100}'}
    note: Legacy twin of Document. Sequence of (IMODocHeader, IMODocBody) repeated 1..unbounded.
  - name: DocHeader
    fields: [DocTitle, DocRevision, DocConfidentiality, CreatedAt]
    field_types:
      DocTitle: 'xs:string'
      DocRevision: 'xs:integer, minInclusive 1'
      CreatedAt: 'xs:dateTime'
  - name: DocConfidentiality
    fields: [DocConfClass, DocConfGroups]
    note: DocConfGroups is optional (minOccurs 0) and carries one or more DocConfGroup strings.
  - name: DocBody
    note: >-
      Abstract in practice — each report schema redefines DocBody (or IMODocBody) with its own
      payload. This is the extension point of the whole model.
  enums:
    ConfidentialityClass:
      current: [PUB, CNF, HCNF, INT]
      legacy: [PUB, CNF, HCNF]
      meaning: {PUB: public, CNF: confidential, HCNF: highly confidential, INT: internal}
      note: >-
        This enum is the machine-readable expression of the split that defines IESO's whole API
        posture — PUB documents land in the anonymous repository, everything else in the
        participant-gated one.
  relationships:
  - {from: Document, to: DocHeader, kind: has_many, via: sequence}
  - {from: Document, to: DocBody, kind: has_many, via: sequence}
  - {from: DocHeader, to: DocConfidentiality, kind: has_one, via: element ref}
  - {from: DocConfidentiality, to: DocConfClass, kind: has_one, via: element ref}
  - {from: DocConfidentiality, to: DocConfGroups, kind: has_one, via: element ref, optional: true}
  - {from: DocConfGroups, to: DocConfGroup, kind: has_many, via: element ref}
  - {from: IMODocument, to: IMODocHeader, kind: has_many, via: sequence}
  - {from: IMODocument, to: IMODocBody, kind: has_many, via: sequence}

report_schemas:
  description: >-
    Twelve report-specific schemas are harvested. Each imports one of the two envelopes and
    specialises DocBody/IMODocBody. Two payload shapes recur across them.
  recurring_types:
  - name: HourlyValue
    used_by:
    - xsd/ieso-dacp-adequacy-r1.xsd
    - xsd/ieso-dacp-commit-r1.xsd
    - xsd/ieso-dacp-predisp-energy-r1.xsd
    - xsd/ieso-dacp-reliability-commit-r1.xsd
    - xsd/ieso-financial-binding-status-r1.xsd
    note: The hour-indexed value is the atomic unit of nearly every IESO market report.
  - name: PriceQuantity
    used_by: [xsd/ieso-dacp-check-source-ade-r1.xsd]
  schemas:
  - {file: xsd/ieso-dacp-adequacy-r1.xsd, envelope: Document, extends: DocBody}
  - {file: xsd/ieso-dacp-check-source-ade-r1.xsd, envelope: Document, extends: DocBody}
  - {file: xsd/ieso-dacp-commit-r1.xsd, envelope: Document, extends: DocBody}
  - {file: xsd/ieso-dacp-predisp-energy-r1.xsd, envelope: Document, extends: DocBody}
  - {file: xsd/ieso-dacp-predisp-prices-r1.xsd, envelope: Document, extends: DocBody}
  - {file: xsd/ieso-dacp-reliability-commit-r1.xsd, envelope: Document, extends: DocBody}
  - {file: xsd/ieso-financial-binding-status-r1.xsd, envelope: Document, extends: DocBody}
  - {file: xsd/ieso-disp-advisory-r1.xsd, envelope: IMODocument, extends: IMODocBody}
  - {file: xsd/ieso-disp-uncons-hoep-r1.xsd, envelope: IMODocument, extends: IMODocBody}
  - {file: xsd/ieso-gen-output-capability-r1.xsd, envelope: IMODocument, extends: IMODocBody}
  - {file: xsd/ieso-intertie-schedule-flow-r1.xsd, envelope: IMODocument, extends: IMODocBody}

report_catalogue:

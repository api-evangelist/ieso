mim_model:
  description: >-
    The participant submission model, read from xsd/ieso-mim-web-services.xsd (62 complex types, 267
    elements). Organised as five bid domains, each with a Submit / Query / Set / Cancel type family.
  source: xsd/ieso-mim-web-services.xsd
  domains:
  - name: Realtime Energy
    types: [RealtimeEnergyBidSubmitType, RealtimeEnergyBidQueryType, RealtimeEnergyBidSetType, RealtimeEnergyBidCancelType, RealtimeEnergySubmitHourlyType, RealtimeEnergyCancelHourlyType]
  - name: Operating Reserve
    types: [OperatingReserveBidSubmitType, OperatingReserveBidQueryType, OperatingReserveBidSetType, OperatingReserveBidCancelType, OperatingReserveSubmitHourlyType, OperatingReserveCancelHourlyType]
  - name: Schedule
    types: [ScheduleBidSubmitType, ScheduleBidQueryType, ScheduleBidSetType, ScheduleBidCancelType, ScheduleSubmitHourlyType]
  - name: Bilateral
    types: [BilateralBidSubmitType, BilateralBidQueryType, BilateralBidSetType, BilateralBidCancelType, BilateralSubmitHourlyType]
  - name: Daily Dispatch Data
    types: [DailyDispatchBidSubmitType, DailyDispatchBidQueryType, DailyDispatchBidSetType]
  - name: Forebay
    types: [ForebayBidSubmitType, ForebayBidQueryType, ForebayBidSetType, ForebayQueryType, ForebaySetType, LinkedForebayType]
  - name: Reference and Status
    types: [ResourceQueryType, ResourceSetType, ResType, MarketStatusType, MarketDetailType, MarketWindowType, MarketMessageQueryType, MarketMessageSetType, MarketMessageType, ActAsMarketParticipantQueryType, ActAsMarketParticipantSetType, ActAsMarketParticipantType, HealthCheckInfoType]
  shared_value_types:
  - {name: PriceQuantityType, note: The price/quantity pair every offer curve is built from.}
  - {name: QueryDateType, note: Date selector on every Query operation.}
  - {name: UploadDateType, note: Date selector on every Upload operation.}
  - {name: QueryStandingType, note: Distinguishes standing from day-specific submissions.}
  ramp_and_physical_types:
  - DailyEnergyRampRateType
  - HourlyEnergyRampRateType
  - RampUpEnergyToMlpType
  - RampUpToMlpColdType
  - RampUpToMlpWarmType
  - RampUpToMlpHotType
  - MinGenBlockDownTimeType
  - ForbiddenRegionType
  - LeadTimeType
  - StartUpOfferType
  status_types:
  - {name: BidProcessingStatusType, fields: [SubmissionTime, TransactionId, 'Message[1..n]'], note: 'Returned on both the success and the fault path. See errors/ieso-error-codes.yml.'}
  - {name: MessageType, fields: [Severity, Code, Description, 'Hour?'], severity_enum: [INFO, WARN, ERROR]}
  relationships:
  - {from: BidProcessingStatusType, to: MessageType, kind: has_many, via: Message}
  - {from: RealtimeEnergyBidSubmitType, to: RealtimeEnergySubmitHourlyType, kind: has_many, via: hourly submission}
  - {from: OperatingReserveBidSubmitType, to: OperatingReserveSubmitHourlyType, kind: has_many, via: hourly submission}
  - {from: ScheduleBidSubmitType, to: ScheduleSubmitHourlyType, kind: has_many, via: hourly submission}
  - {from: BilateralBidSubmitType, to: BilateralSubmitHourlyType, kind: has_many, via: hourly submission}
  - {from: ForebayBidSubmitType, to: LinkedForebayType, kind: has_many, via: linked forebay}
  - {from: ResourceSetType, to: ResType, kind: has_many, via: resource list}
  - {from: MarketStatusType, to: MarketDetailType, kind: has_many, via: market list}
  - {from: MarketDetailType, to: MarketWindowType, kind: has_many, via: window list}
  - {from: MarketMessageSetType, to: MarketMessageType, kind: has_many, via: message list}

join_keys:
  note: >-
    The two models meet only in the domain, not in the schema. There is no shared identifier type
    between a MIM submission and a published report; correlation is by resource name, delivery date
    and delivery hour.
  keys: [resource name, delivery date, delivery hour, market (DAM / Pre-Dispatch / Real-Time)]

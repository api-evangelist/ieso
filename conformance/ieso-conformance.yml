    version: V3.0
    relationship: administrator
    evidence: >-
      Licensed Ontario transmission and distribution entities must report cyber security incidents to
      the IESO as defined in the OCSS. Amendment enacted 2025-09-22.
    url: https://www.ieso.ca/Sector-Participants/Cyber-Security/Cyber-Security-Incident-Reporting
  - id: nerc-cip-003
    relationship: reporting authority
    evidence: >-
      Market participants with Low impact BES Cyber Systems report to the IESO under IESO Market
      Manual 7.1.
  - id: nerc-cip-008
    relationship: reporting authority
    evidence: Market participants with Medium or High impact BES Cyber Systems report to the IESO.
  - id: npcc-directory-1

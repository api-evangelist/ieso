homonymTrap: >-
  github.com/ieso returns HTTP 200 but is "Ieso Digital Health", a Cambridge UK online mental health
  therapy company (blog https://ieso.ai). It is NOT the Independent Electricity System Operator and was
  deliberately excluded. No GitHub organization was found for the Ontario IESO.

findings:
  summary: >-
    IESO is the clearest "open on the way out, sealed on the way in" provider profiled in this sector.
    The read surface is exemplary for a system operator by volume and honesty — 139 report directories,
    5-minute to monthly cadence, CSV/XML/XLSX, published XSDs, no gate — and unusable as a modern API
    by contract standards: no OpenAPI, no query parameters, no filtering, no pagination, no
    content negotiation, no documented rate limits, no versioned resource model, no open-data licence.
    A developer integrates by parsing directory listings and constructing filenames. Meanwhile every
    genuinely API-shaped thing IESO operates — Axway REST, Appian REST with three API-key modes, SOAP
    with 23 operations — is behind market participant registration. And the sector's headline question
    simply does not arise here: Ontario mandated Green Button, but on distributors, and the system
    operator is not one, so IESO holds no consumer energy data to mandate access to.
  agentReadiness: >-
    Low despite the open data. Nothing on ieso.ca is machine-discoverable in a modern sense: no
    /.well-known/, no llms.txt found, no OpenAPI, no JSON API, no schema.org dataset markup observed on
    the Data Directory. An agent can fetch a CSV if it already knows the filename convention; it cannot
    discover the surface.

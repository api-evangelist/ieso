- aid: ieso:ieso-reports-site-rest-api
  name: IESO Reports Site REST API
  description: >-
    A RESTful file-access API provided by Axway SecureTransport, used to automate retrieval of reports
    from the IESO Reports Site. Accepts and returns both JSON and XML, and exposes file and directory
    listing (GET /files, GET /files/{path}), file property inspection (?status) and file download, with
    limit, sortBy and order parameters. Every request must carry the query string parameter
    ?idp_id=ieso and HTTP Basic credentials. IESO documents this endpoint only for the CONFIDENTIAL
    participant report repository — the guide states plainly that "the recommended programmatic access
    applies to confidential reports repository and not public reports". Credentials are IESO-issued
    machine accounts granted to registered Ontario market participants on request; there is no
    self-serve signup. Probed anonymously on 2026-07-27: https://reports.ieso.ca/api/v1.4/files?idp_id=ieso
    returned HTTP 401, and the sandbox at reports-sandbox.ieso.ca returned HTTP 401. The same path on
    the public host (reports-public.ieso.ca) returned HTTP 404 — the open data is not served through
    this API.
  humanURL: https://www.ieso.ca/sector-participants/technical-interfaces
  baseURL: https://reports.ieso.ca/api/v1.4
  tags:
  - Reports
  - File Transfer
  - Market Participants
  - REST
  properties:
  - type: Documentation
    url: https://www.ieso.ca/-/media/Files/IESO/technical-interfaces/api-reports-guide/IESO_Reports_API_Guide.pdf
  - type: Specification

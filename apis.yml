- aid: ieso:ieso-registration-facilities-api
  name: IESO Registration System Facilities API
  description: >-
    A REST API on the Appian-based Online IESO platform for retrieving and maintaining facility
    registration data. SPEC-249 documents the base path https://online.ieso.ca/suite/webapi/ and the
    facilities resource at https://online.ieso.ca/suite/webapi/reg-v1-facilities/, with a sandbox at
    https://onlinesandbox.ieso.ca/suite/webapi/. Authentication is by Appian API key, supplied three
    ways — HTTP Basic with the key as username-and-blank-password (or the reverse), an Appian-API-Key
    header, or an Authorization Bearer header — over mandatory HTTPS; a missing or invalid Authorization
    header returns 401. There is no self-serve key issuance: the organization's registered IESO Rights
    Administrator must request an API machine account with "Registration API" access, so this is a
    market-participant-only surface.
  humanURL: https://www.ieso.ca/sector-participants/technical-interfaces
  baseURL: https://online.ieso.ca/suite/webapi/reg-v1-facilities
  tags:
  - Registration
  - Facilities
  - Market Participants
  - REST
  properties:
  - type: Documentation
    url: https://www.ieso.ca/-/media/Files/IESO/technical-interfaces/registration-system/FacilityAPISpecification-SPEC-249.pdf
  - type: Documentation
    url: https://www.ieso.ca/sector-participants/technical-interfaces
- aid: ieso:ieso-retrofit-api
  name: IESO Retrofit System API
  description: >-
    A web service API for the Retrofit program under Save on Energy, IESO's conservation and demand
    management portfolio, allowing participants to integrate with the Retrofit application and project
    workflow. SPEC-188 documents it on the same Online IESO Appian platform
    (https://online.ieso.ca/suite/webapi/) using API-key authentication via HTTP Basic, an
    Appian-API-Key header, or a Bearer token. Access requires an IESO-issued API machine account; there
    is no public signup and no anonymous endpoint.
  humanURL: https://www.ieso.ca/sector-participants/technical-interfaces
  baseURL: https://online.ieso.ca/suite/webapi
  tags:
  - Energy Efficiency
  - Demand Response
  - Retrofit
  - REST
  properties:
  - type: Documentation
    url: https://www.ieso.ca/-/media/Files/IESO/technical-interfaces/retrofit-system/RetrofitAPI-SPEC-188.pdf
  - type: Documentation
    url: https://www.ieso.ca/sector-participants/technical-interfaces
- aid: ieso:ieso-retrofit-service-provider-api
  name: IESO Retrofit Service Provider API
  description: >-
    A companion web service API documented in SPEC-232 for service providers participating in the Save
    on Energy Retrofit program, covering the service-provider side of project submission and management
    on the Online IESO platform. Participant-only; requires an IESO-issued API account. No public
    self-serve credential issuance is published. SPEC-232 documents the Appian root endpoint
    https://online.ieso.ca/suite/webapi/ with eight rft-sp-v1-* resource suffixes (applications,
    appdetails, appdoc, appcomments, facilities, facdetails, facdoc, persons), GET/PUT/POST/DELETE
    methods, API-key authentication in three forms, and the only published HTTP status code table in
    the IESO estate (200, 201, 400, 401, 403, 404, 408, 429). The sandbox and production root endpoint
    values are themselves redacted to "URL value" in the public PDF.
  humanURL: https://www.ieso.ca/sector-participants/technical-interfaces
  baseURL: https://online.ieso.ca/suite/webapi
  tags:
  - Energy Efficiency
  - Service Providers
  - Retrofit
  properties:
  - type: Documentation
    url: https://www.ieso.ca/-/media/Files/IESO/technical-interfaces/retrofit-system/RetrofitServiceProviderAPI-SPEC-232.pdf
  - type: Documentation
    url: https://www.ieso.ca/sector-participants/technical-interfaces
- aid: ieso:ieso-dispatch-service-web-service
  name: IESO Dispatch Service Web Service
  description: >-
    A web service, specified in SPEC-154, through which registered market participants retrieve dispatch
    instructions issued by the IESO and send back acknowledgements and responses. This is the machine
    interface to real-time dispatch of Ontario's grid. The design specification is published openly as a
    PDF, but no base URL is disclosed in it and access is restricted to registered market participants
    operating dispatchable facilities.
  humanURL: https://www.ieso.ca/sector-participants/technical-interfaces
  tags:
  - Dispatch
  - Real Time
  - Market Participants
  properties:
  - type: Documentation
    url: https://www.ieso.ca/-/media/Files/IESO/technical-interfaces/dispatch-service-system/SPEC-154-Dispatch-Service-Web-Service-Design-Specifications.pdf
  - type: Documentation
    url: https://www.ieso.ca/sector-participants/technical-interfaces
- aid: ieso:ieso-dispatch-notification-service
  name: IESO Dispatch Notification Service Web Service
  description: >-
    A push-notification web service, specified in SPEC-155, that delivers automated notifications of
    dispatch instructions to registered market participants rather than requiring them to poll. The
    design specification is published openly; the endpoint and credentials are issued only to registered
    market participants.
  humanURL: https://www.ieso.ca/sector-participants/technical-interfaces
  tags:
  - Dispatch
  - Notifications
  - Push
  - Market Participants
  properties:
  - type: Documentation
    url: https://www.ieso.ca/-/media/Files/IESO/technical-interfaces/dispatch-service-system/SPEC-155-Dispatch-Notification-Service-Web-Service-Design-Specifications.pdf
  - type: Documentation
    url: https://www.ieso.ca/sector-participants/technical-interfaces
  - type: Webhooks

    url: skills/ieso-dispatch-notification-receiver.md
- aid: ieso:ieso-ocss-web-service
  name: IESO Outage Coordination and Scheduling System (OCSS) Web Service
  description: >-
    A web service, specified in SPEC-113, for submitting and managing transmission and generation outage
    requests in IESO's Outage Coordination and Scheduling System. The design specification is public;
    the service itself is restricted to registered market participants. Note that the resulting outage
    data is republished anonymously through the public report repository (TxOutages* and
    TxOutagesTodayAll directories) — the write side is gated, the read side is open.
  humanURL: https://www.ieso.ca/sector-participants/technical-interfaces
  tags:
  - Outages
  - Scheduling
  - Transmission
  - Market Participants
  properties:
  - type: Documentation
    url: https://www.ieso.ca/-/media/Files/IESO/technical-interfaces/outage-management/WebServiceDesignSpec_SPEC-113.pdf
  - type: Documentation
    url: https://www.ieso.ca/sector-participants/technical-interfaces

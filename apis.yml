apis:
- aid: ieso:ieso-public-reports-repository
  name: IESO Public Reports Repository
  description: >-
    The IESO's open market and system data surface. A flat HTTPS file repository publishing 139 report
    directories — hourly Ontario and market demand, HOEP and nodal/zonal prices, day-ahead and
    pre-dispatch LMPs, generator output and capability, generation by fuel type, intertie schedules and
    flows, transmission and generation outages, operating reserve, adequacy, transmission rights auction
    results and settlement uplift — as CSV, XML and XLSX. Report URLs follow a documented, stable
    pattern (https://reports-public.ieso.ca/public/<Document Identifier>/PUB_<Report>_<date>_v<n>.<ext>)
    and are readable anonymously with no account, API key, registration or licence acceptance. Verified
    HTTP 200 on the root listing and on a live data file on 2026-07-27. This is not a REST API — there
    are no query parameters, filtering, pagination or content negotiation — but it is a documented,
    machine-readable, schema-backed retrieval interface intended for automation, described in IESO's
    own Outbound Automated Document specification (IMO_SPEC_0100).
  humanURL: https://www.ieso.ca/en/Power-Data/Data-Directory
  baseURL: https://reports-public.ieso.ca/public/
  tags:
  - Market Data
  - Open Data
  - Electricity
  - Reports
  - Ontario

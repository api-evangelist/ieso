aid: ieso
url: https://raw.githubusercontent.com/api-evangelist/ieso/refs/heads/main/apis.yml
name: IESO
kind: company
description: >-
  The Independent Electricity System Operator (IESO) is the Crown corporation that operates Ontario's
  bulk electricity system and administers the province's wholesale electricity market, balancing supply
  and demand in real time, running the day-ahead and real-time energy and operating reserve markets,
  procuring capacity and transmission rights, planning the provincial grid, and delivering the Save on
  Energy conservation programs. It sits at the top of Canada's largest provincial electricity value
  chain — upstream of the licensed local distribution companies that bill retail customers — which is
  why its API posture splits cleanly in two. Its market and system data surface is genuinely open: a
  public report repository at reports-public.ieso.ca serves 139 report directories of demand, price,
  generation-by-fuel, intertie flow, outage, adequacy and settlement data as CSV, XML and XLSX over
  anonymous HTTPS with no account, key or registration, backed by published XSD schemas and a public
  interface specification. Its programmatic APIs are the opposite: the Axway SecureTransport REST API
  at reports.ieso.ca/api/v1.4, the SOAP Market Information Management web services, and the Appian-based
  Online IESO registration, retrofit, dispatch and outage web services are all reserved for registered
  Ontario market participants with IESO-issued machine accounts. IESO publishes no consumer energy-data
  API: Ontario's Green Button mandate (O. Reg. 633/21) binds licensed electricity and gas distributors,
  not the system operator, so there is no retail usage or billing surface here at all.
image: https://www.ieso.ca/-/media/Images/IESO/Logo/ieso-logo-lrg.png
tags:

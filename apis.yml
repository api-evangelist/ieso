- aid: ieso:ieso-mim-web-services
  name: IESO Market Information Management (MIM) Web Services
  description: >-
    SOAP web services that let registered Ontario market participants submit and retrieve market
    information programmatically. The published WSDL (service name emim-web-service, target namespace
    http://webservices.ieso.ca/emim/) declares 23 operations covering real-time energy bid upload,
    query and cancel, operating reserve bids, schedule bids, bilateral contract bids, daily dispatch
    data, forebay data, resource and market status queries, market messages, an act-as-market-participant
    operation and a health check. Access requires an IESO UserID and password (formatted
    user@participantName) plus source IP whitelisting and a client truststore; IESO documents a sandbox
    endpoint at https://webservices-sandbox.ieso.ca/emim. Neither the production host
    (webservices.ieso.ca) nor the sandbox host resolved or connected from the open internet on
    2026-07-27 (curl exit code 000), consistent with network-level restriction to whitelisted
    participants. The WSDL and its schema are, however, downloadable anonymously from ieso.ca and are
    harvested here verbatim.
  humanURL: https://www.ieso.ca/sector-participants/technical-interfaces
  baseURL: https://webservices.ieso.ca/emim
  tags:
  - SOAP
  - Bids and Offers
  - Market Participants
  - Energy Markets
